name = "leanin"
version = "0.1.0"
defaultTargets = [
  "LeanIn",
  "spike",
  "wakerspike",
  "controls",
  "dynamics",
  "bridgecontrols",
  "server",
]

[[lean_lib]]
name = "LeanIn"

[[lean_exe]]
name = "spike"
root = "Spike"

[[lean_exe]]
name = "wakerspike"
root = "WakerSpike"

[[lean_exe]]
name = "controls"
root = "Controls"
moreLinkArgs = ["-lnetuv", "-luv"]

[[lean_exe]]
name = "dynamics"
root = "Dynamics"

[[lean_exe]]
name = "bridgecontrols"
root = "BridgeControls"

[[lean_exe]]
name = "server"
root = "Server"
moreLinkArgs = ["-lnetuv", "-luv"]

[[lean_exe]]
name = "defuncEcho"
root = "DefuncEcho"
moreLinkArgs = ["-lnetuv", "-luv"]

[[lean_exe]]
name = "stdServer"
root = "StdServer"
moreLinkArgs = ["-luv"]

[[lean_exe]]
name = "h1bench"
root = "H1Bench"
