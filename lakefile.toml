name = "leanin"
version = "0.1.0"
description = "A concurrency runtime and work-stealing scheduler for Lean 4: Tokio's algorithms, an async that compiles to data rather than closures, and machine-checked proofs for the properties that matter."
keywords = [
  "concurrency",
  "scheduler",
  "async",
  "runtime",
  "software-verification",
  "ffi",
]
license = "Apache-2.0"
licenseFiles = ["LICENSE", "NOTICE"]
defaultTargets = [
  "LeanIn",
  "spike",
  "wakerspike",
  "controls",
  "dynamics",
  "bridgecontrols",
  "server",
]

[[lean_lib]]
name = "LeanIn"

[[lean_exe]]
name = "spike"
root = "LeanIn.Exe.Spike"

[[lean_exe]]
name = "wakerspike"
root = "LeanIn.Exe.WakerSpike"

[[lean_exe]]
name = "controls"
root = "LeanIn.Exe.Controls"
moreLinkArgs = ["-lnetuv", "-luv"]

[[lean_exe]]
name = "dynamics"
root = "LeanIn.Exe.Dynamics"

[[lean_exe]]
name = "bridgecontrols"
root = "LeanIn.Exe.BridgeControls"

[[lean_exe]]
name = "server"
root = "LeanIn.Exe.Server"
moreLinkArgs = ["-lnetuv", "-luv"]

[[lean_exe]]
name = "defuncEcho"
root = "LeanIn.Exe.DefuncEcho"
moreLinkArgs = ["-lnetuv", "-luv"]

[[lean_exe]]
name = "stdServer"
root = "LeanIn.Exe.StdServer"
moreLinkArgs = ["-luv"]

[[lean_exe]]
name = "h1bench"
root = "LeanIn.Exe.H1Bench"
